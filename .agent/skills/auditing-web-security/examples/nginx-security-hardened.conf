# ==============================================================================
# Enterprise Hardened Nginx Configuration
# Compliant with OWASP Security Recommendations & A+ SSL Labs Guidelines
# ==============================================================================

# Worker Configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version banner
    server_tokens off;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Request Body & Buffer Limits (DoS Mitigation)
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Rate Limiting Zones (Brute-Force & DoS Protection)
    # General API rate limit: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # Strict Authentication rate limit: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Logging Format with Security Audit Fields
    log_format security_audit '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log security_audit;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # HTTP to HTTPS Strict Redirect Server
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME Challenge location for Let's Encrypt certificates
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS with 301 Permanent Redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Production Hardened HTTPS Server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name example.com www.example.com;

        # HTTP/2 (Nginx 1.25.1+: separate directive, no longer a listen param)
        http2 on;

        root /var/www/html/public;
        index index.php index.html;

        # TLS / SSL Hardening (TLS 1.2 and TLS 1.3 only)
        ssl_certificate /etc/ssl/certs/example.com.crt;
        ssl_certificate_key /etc/ssl/private/example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # Mandatory Enterprise Security Headers
        # ----------------------------------------------------------------------
        # HSTS (Strict-Transport-Security): 2 years with subdomains and preload
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Clickjacking defense (Frame Options)
        add_header X-Frame-Options "DENY" always;

        # NOTE: X-XSS-Protection is deprecated (removed in Chrome 78+, Firefox, Edge).
        # Modern browsers rely on CSP instead — do NOT add X-XSS-Protection.

        # Referrer Policy: Send full URL for same-origin, origin only for cross-origin HTTPS
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions Policy (Restrict browser device capabilities)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # Content Security Policy (CSP): Enforces strict script and style sources
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-RANDOM_SEED'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        # ----------------------------------------------------------------------
        # Block Hidden Files, Git Repositories, and Sensitive Configuration
        # ----------------------------------------------------------------------
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* (\.env|\.git|\.yml|\.yaml|\.sql|\.bak|\.inc|\.conf|\.sh)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ----------------------------------------------------------------------
        # Authentication Route: Rate Limited
        # ----------------------------------------------------------------------
        location ~* ^/(login|auth|password/reset) {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_conn addr_limit 5;
            try_files $uri /index.php?$query_string;
        }

        # ----------------------------------------------------------------------
        # API Routes: Rate Limited
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn addr_limit 20;
            try_files $uri /index.php?$query_string;
        }

        # ----------------------------------------------------------------------
        # Standard Application Routing (FastCGI / PHP-FPM)
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY ""; # Mitigate httpoxy vulnerability
            fastcgi_intercept_errors on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
        }
    }
}
